name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# CRITICAL: 최소 권한만 명시한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 연속 push 시 배포가 뒤엉키지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # withastro/action이 패키지 매니저를 감지해 의존성을 설치하고
      # `npm run build`(= astro check && astro build)를 실행한 뒤 dist를 Pages 아티팩트로 올린다.
      # astro check가 실패하면 이 스텝에서 워크플로가 멈추고 deploy 잡은 실행되지 않는다.
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 22

      # 깨진 내부 링크도 동일하게 배포를 막는다.
      - name: Check internal links
        run: node scripts/check-links.mjs dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
